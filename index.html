<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHI69 | Night Edition</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #f0f0f0;
            --text-muted: #888;
            --blue-glow: #0055ff;
            --glass-bg: rgba(20, 20, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -20%;
            left: 50%;
            transform: translateX(-50%);
            width: 100vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(0, 85, 255, 0.15) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 1.5s ease-out;
        }

        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .car-image {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            object-position: center;
        }

        .brand-title {
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-weight: 300;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .clock-display {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--blue-glow);
            text-shadow: 0 0 10px rgba(0, 85, 255, 0.5);
            letter-spacing: 1px;
            direction: ltr;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            text-align: center;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 1.2rem 1.5rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transition: 0.5s;
        }

        .glass-card:hover {
            border-color: rgba(0, 85, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 85, 255, 0.1);
        }

        .glass-card:hover::before {
            left: 100%;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-icon {
            font-size: 1.2rem;
            color: var(--blue-glow);
            transition: transform 0.3s ease;
        }

        .glass-card:hover .card-icon {
            transform: translateX(-5px);
        }

        .code-section {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            font-family: monospace;
            direction: ltr;
            text-align: left;
            margin-top: 1rem;
        }

        .code-header {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-family: 'Vazirmatn', sans-serif;
            letter-spacing: 2px;
            direction: rtl;
            text-align: right;
        }

        .code-content {
            color: #e0e0e0;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .keyword { color: #ff7b72; }
        .function { color: #d2a8ff; }
        .punctuation { color: #8b949e; }
        .string { color: #a5d6ff; }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            border-top: 1px solid var(--glass-border);
            padding-top: 1.5rem;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 768px) {
            .container { max-width: 600px; }
        }
    </style>
</head>
<body>

    <div class="container">

        <header class="header">
            <img src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?q=80&w=1000&auto=format&fit=crop" class="car-image" alt="Mercedes-Benz CLS">
            <h1 class="brand-title">Mercedes-Benz CLS · Night Edition</h1>
            <div class="clock-display" id="clock">00:00:00</div>
        </header>

        <section class="links-section">
            <div class="section-title">Connect with me</div>
            <div class="links-container">
                <a href="https://t.me/" class="glass-card" target="_blank">
                    <div class="card-info">
                        <span class="card-title">تلگرام</span>
                        <span class="card-desc">پیام بده یا دنبالم کن</span>
                    </div>
                    <span class="card-icon">↗</span>
                </a>

                <a href="https://instagram.com/" class="glass-card" target="_blank">
                    <div class="card-info">
                        <span class="card-title">اینستاگرام</span>
                        <span class="card-desc">لحظه‌ها و حال‌وهوای من</span>
                    </div>
                    <span class="card-icon">↗</span>
                </a>

                <a href="https://github.com/mehi69" class="glass-card" target="_blank">
                    <div class="card-info">
                        <span class="card-title">گیت‌هاب</span>
                        <span class="card-desc">Code · Learn · Build</span>
                    </div>
                    <span class="card-icon">↗</span>
                </a>

                <a href="mailto:your-email@gmail.com" class="glass-card">
                    <div class="card-info">
                        <span class="card-title">ارتباط مستقیم</span>
                        <span class="card-desc">برای ارتباط با من</span>
                    </div>
                    <span class="card-icon">↗</span>
                </a>
            </div>
        </section>

        <section class="code-section">
            <div class="code-header">CURRENT MINDSET / 001</div>
            <div class="code-content"><span class="keyword">while</span> <span class="punctuation">(</span><span class="function">alive</span><span class="punctuation">)</span> <span class="punctuation">{</span>
  <span class="function">code</span><span class="punctuation">();</span>
  <span class="function">learn</span><span class="punctuation">();</span>
  <span class="function">build</span><span class="punctuation">();</span>
<span class="punctuation">}</span></div>
        </section>

        <footer>
            DESIGNED IN THE DARK · MEHI69 © <span id="year"></span>
        </footer>

    </div>

    <script>
        const clockElement = document.getElementById("clock");
        function updateClock() {
            const now = new Date();
            const timeString = new Intl.DateTimeFormat("fa-IR", {
                hour: "2-digit", 
                minute: "2-digit", 
                second: "2-digit",
                hour12: false
            }).format(now);
            clockElement.textContent = timeString;
        }

        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
